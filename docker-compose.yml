services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: valenbisi-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:2
    container_name: valenbisi-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: valenbisi
      DOCKER_INFLUXDB_INIT_BUCKET: valenbisi
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: valenbisi-token
  telegraf:
    image: telegraf:1.36
    container_name: valenbisi-telegraf
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  collector:
    build: ./collector
    container_name: valenbisi-collector
    depends_on:
      - mosquitto
  grafana:
    image: grafana/grafana:latest
    container_name: valenbisi-grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  # ===================== AÑADIDO: PostgreSQL =====================
  postgres:
    image: postgres:16
    container_name: valenbisi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: valenbisi
      POSTGRES_PASSWORD: valenbisi_pass
      POSTGRES_DB: valenbisi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ===================== AÑADIDO: pgAdmin =====================
  pgadmin:
    image: dpage/pgadmin4
    container_name: valenbisi-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@valenbisi.org
      PGADMIN_DEFAULT_PASSWORD: admin12345
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  # ===================== AÑADIDO: InfluxDB -> PostgreSQL =====================
  sync:
    build: ./sync
    container_name: valenbisi-sync
    depends_on:
      - influxdb
      - postgres
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: valenbisi-token
      INFLUX_ORG: valenbisi
      INFLUX_BUCKET: valenbisi
      PG_HOST: postgres
      PG_DB: valenbisi
      PG_USER: valenbisi
      PG_PASSWORD: valenbisi_pass
    restart: unless-stopped

  # ===================== AÑADIDO: Aplicación Flask =====================
  web:
    build: ./web
    container_name: valenbisi-web
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      PG_HOST: postgres
      PG_DB: valenbisi
      PG_USER: valenbisi
      PG_PASSWORD: valenbisi_pass
    restart: unless-stopped

# ===================== AÑADIDO: volumen para PostgreSQL =====================
volumes:
  pgdata:
