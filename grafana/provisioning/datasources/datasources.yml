apiVersion: 1
datasources:
  - name: Valenbisi-InfluxDB
    uid: influx-valenbisi
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: valenbisi
      defaultBucket: valenbisi
    secureJsonData:
      token: valenbisi-token

  - name: Valenbisi-Postgres
    uid: postgres-valenbisi
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: valenbisi
    database: valenbisi
    secureJsonData:
      password: valenbisi_pass
    jsonData:
      sslmode: disable
      postgresVersion: 1600
